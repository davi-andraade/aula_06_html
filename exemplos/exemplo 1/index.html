<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilização de páginas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- RELEMBRANDO WIDTH E HEIGHT -->
    <div class="caixa1">
        <p>Criando uma caixa</p>
    </div>

    <!-- DISPLAY BLOCK -->
    <div class="displayb">Caixa 1</div>
    <div class="displayb">Caixa 2</div>

    <!-- DIPLAY INLINE -->
    <span class="spanin">Span 1</span>
    <span class="spanin">Span 2</span>

    <!-- MARGIN E PADDING -->
    <div class="area">
        <div class="caixa">Olá, alunos</div>
    </div>

    <!-- DISPLAY FLEX -->
    <div class="area-flex">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>

    <!-- DISPLAY GRID -->
    <div class="cartao">
        <div class="item-cartao">Item 1</div>
        <div class="item-cartao">Item 2</div>
        <div class="item-cartao">Item 3</div>
        <div class="item-cartao">Item 4</div>
        <div class="item-cartao">Item 5</div>
        <div class="item-cartao">Item 6</div>
    </div>

</body>
</html>
